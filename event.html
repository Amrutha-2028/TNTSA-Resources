<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event | Tennessee TSA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="box.png">

</head>

<body>



<main>

<section class="event-hero">

    <a href="index.html" class="back-link">
        ← All Competitive Events
    </a>

    <div class="event-labels">
        <span id="eventLevel"></span>
        <span id="eventNew" class="new-badge"></span>
    </div>

    <h1 id="eventTitle">
        Interior Design
    </h1>

    <p id="eventSubtitle"></p>

</section>


<section class="event-content">

    <div class="event-info-grid">

        <div class="info-box">
            <span>ELIGIBILITY</span>
            <strong id="eligibility"></strong>
        </div>

        <div class="info-box">
            <span>TEAM SIZE</span>
            <strong id="teamSize"></strong>
        </div>

        <div class="info-box">
            <span>COMPETITION</span>
            <strong id="competition"></strong>
        </div>

    </div>


    <section class="content-section">

        <h2>
            What is this event?
        </h2>

        <p id="description"></p>

        <div class="challenge-box">

            <span>
                THE CHALLENGE
            </span>

            <p id="challenge"></p>

        </div>

    </section>


    <section
        class="content-section"
        id="themeSection"
    >

        <h2>
            Theme & Design Problem
        </h2>

        <div class="theme-box">

            <span id="themeLabel">
                THEME
            </span>

            <h3 id="themeTitle"></h3>

            <p id="themeText"></p>

            <div id="themeTopics"></div>

            <div id="themeRequirements"></div>

            <a
                id="themeLink"
                href="#"
                target="_blank"
                rel="noopener"
            >
                View Official Problem →
            </a>

        </div>

    </section>


    <section class="content-section">

        <h2>
            What do you submit?
        </h2>

        <div
            id="submissions"
            class="submission-grid"
        ></div>

    </section>


    <section class="content-section">

        <h2>
            Important Dates
        </h2>

        <div
            id="deadlines"
            class="timeline"
        ></div>

    </section>


    <section class="content-section">

        <h2>
            Official Resources
        </h2>

        <div
            id="resources"
            class="resource-list"
        ></div>

    </section>

</section>

</main>


<footer>

    <div class="footer-container">

        <h2>
            TENNESSEE TSA
        </h2>

        <p>
            Technology Student Association
        </p>

    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
